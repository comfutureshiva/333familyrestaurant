name: Deploy 333 site to Hostinger

# Runs on every push to the main branch
on:
  push:
    branches: [ main ]
  workflow_dispatch:   # also lets you trigger it manually from the Actions tab

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build site
        run: npm run build

      - name: Deploy dist/ to Hostinger public_html via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: /domains/333familyrestaurant.com/public_html/
          dangerous-clean-slate: false
          state-name: .ftp-deploy-sync-state-${{ github.run_id }}.json
          timeout: 120000
